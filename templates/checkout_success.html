
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單明細</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <main>
        <h1>訂單成立！</h1>

        <section>
            <h2>訂單資訊</h2>

            <p>訂單編號：#{{ order.id }}</p>

            <p>建立時間：{{ order.created_at }}</p>

            <p>訂單狀態：{{ order.status }}</p>
        </section>

        <section>
            <h2>商品明細</h2>

            {% for item in order["items"] %}
                <div>
                    <h3>{{ item.product_name }}</h3>

                    <p>
                        單價：NT$ {{ item.unit_price }}
                    </p>

                    <p>
                        數量：{{ item.quantity }}
                    </p>

                    <p>
                        小計：NT$ {{ item.subtotal }}
                    </p>
                </div>
            {% endfor %}
        </section>

        <section>
            <h2>總金額</h2>

            <p>NT$ {{ order.total }}</p>
        </section>

        <a href="{{ url_for('index') }}">返回首頁</a>
    </main>

</body>
</html>
