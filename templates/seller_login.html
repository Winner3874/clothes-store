<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>賣家登入｜StyleLab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="storefront seller-page">
    <nav class="navbar navbar-dark bg-dark store-nav"><div class="container"><a class="navbar-brand" href="{{ url_for('index') }}"><span class="brand-mark">S</span> StyleLab</a><a class="back-link mb-0" href="{{ url_for('index') }}">返回商店　←</a></div></nav>
    <main class="container seller-login-wrap">
        {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}" role="status">{{ message }}</div>{% endfor %}{% endwith %}
        <section class="seller-login-card"><p class="eyebrow">STYLELAB MERCHANT</p><h1>賣家登入</h1><p>登入後即可管理商品庫存。</p>
            <form method="post" action="{{ url_for('seller_login') }}"><label for="username">管理員帳號</label><input id="username" name="username" autocomplete="username" required><label for="password">密碼</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="checkout-button" type="submit">登入管理後台　→</button></form>
            <small>尚未設定管理員帳密？請在啟動網站前設定 ADMIN_USERNAME 與 ADMIN_PASSWORD。</small>
        </section>
    </main>
</body>
</html>
