<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ product.name }}｜StyleLab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container"><a class="navbar-brand" href="{{ url_for('index') }}">StyleLab</a><span class="text-muted">日常穿搭選物</span></div>
    </nav>
    <main class="container pb-5">
        <p><a href="{{ url_for('index') }}">← 返回商品列表</a></p>
        <article class="card product-detail-card mx-auto">
            <div class="product-detail-icon" aria-hidden="true">{{ product.img }}</div>
            <div class="card-body p-4 p-md-5">
                <span class="small text-muted">{{ product.category }}</span>
                <h1 class="h2 mt-2">{{ product.name }}</h1>
                <p class="text-muted mt-3">{{ product.desc }}</p>
                <p class="h3 fw-bold mt-4">NT$ {{ "{:,}".format(product.price) }}</p>
                <form action="{{ url_for('add_to_cart', product_id=product.id) }}" method="post" class="mt-4">
                    <button class="btn btn-primary" type="submit">加入購物車</button>
                </form>
            </div>
        </article>
    </main>
</body>
</html>
